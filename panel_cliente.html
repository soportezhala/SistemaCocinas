<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido cliente</title>

  <!-- ================= ADAPTADOR google.script.run -> fetch (DEBE IR ANTES) ================= -->
  <script>
  /**
   * Permite que panel_cliente.html funcione fuera de Apps Script
   * usando fetch() contra el Web App
   */
  (function () {
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwOh48dsgpGVhCUbs4250L7dMHbbAvvv1-rdLWHq9pK5xiMfhQmS1HaRR2t2BZ0xblfOg/exec";

    if (window.google && window.google.script && window.google.script.run) {
      return; // Apps Script real
    }

    window.google = {
      script: {
        run: {
          _successHandler: null,
          _failureHandler: null,

          withSuccessHandler(fn) { this._successHandler = fn; return this; },
          withFailureHandler(fn) { this._failureHandler = fn; return this; },

          obtenerDatosCliente(dia) {
            callApi({ action: "obtenerCatalogoCliente", dia }, this);
          },
          crearCarritoCliente(cliente, dia, items) {
            callApi({ action: "crearPedidoCliente", cliente, dia, items }, this);
          }
        }
      }
    };

    function callApi(payload, ctx) {
      fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(r => r.json())
      .then(data => {
        if (!data.exito) throw new Error(data.message || "Error API");
        ctx._successHandler && ctx._successHandler(data);
      })
      .catch(err => {
        console.error("API error:", err);
        ctx._failureHandler && ctx._failureHandler(err);
      });
    }
  })();
  </script>

  <style>
    :root {
      --ink: #14313f;
      --muted: #66727c;
      --paper: #fffaf3;
      --card: #ffffff;
      --line: #eadccd;
      --teal: #087486;
      --coral: #e87352;
      --gold: #f2bc45;
      --soft: #f7efe5;
      --danger: #b84434;
      --ok: #2f8057;

      --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-display: Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(242,188,69,.22), transparent 30%),
        linear-gradient(135deg, #fffaf3 0%, #f3e7d7 100%);
      font-family: var(--font-ui);
    }

    h1, h2 { font-family: var(--font-display); }
    h3, h4 { font-family: var(--font-ui); font-weight: 600; }

    button, input, select { font: inherit; }

    .page { max-width: 1380px; margin: 0 auto; padding: 24px; }

    .panel {
      background: rgba(255,255,255,.9);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 18px 48px rgba(75, 51, 28, .09);
      padding: 22px;
    }

    h1 { margin-bottom: 8px; font-size: clamp(2rem, 5vw, 4rem); line-height: .98; letter-spacing: -.04em; }
    h2 { font-size: 1.4rem; margin-bottom: 8px; }
    h3 { font-size: 1rem; margin-bottom: 10px; }

    .muted { color: var(--muted); line-height: 1.45; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 380px);
      grid-template-areas:
        "hero cart"
        "message cart"
        "products cart";
      gap: 20px;
    }

    .hero-panel { grid-area: hero; }
    .workspace-message { grid-area: message; }
    .products-grid { grid-area: products; }
    .cart { grid-area: cart; }

    .products-grid { display: grid; grid-template-columns: repeat(2, minmax(280px, 1fr)); gap: 20px; }

    .badge {
      display: inline-flex; align-items: center;
      border-radius: 999px; background: var(--soft);
      border: 1px solid var(--line);
      padding: 6px 10px; font-size: .82rem; color: #725a45;
    }

    .btn {
      border: 0; border-radius: 999px; min-height: 44px;
      padding: 10px 14px; font-weight: 700; cursor: pointer;
      color: #fff; background: var(--coral);
    }
    .btn.primary { background: var(--teal); }
    .btn.ghost { color: var(--ink); background: #fff; border: 1px solid #d7c8b8; }

    .cart { position: sticky; top: 12px; display: grid; gap: 12px; }

    .notice { display:none; border-radius:16px; padding:12px; }
    .notice.show { display:block; }
    .notice.error { background:#fff1ee; color:var(--danger); }
    .notice.ok { background:#eef9f1; color:var(--ok); }
    .notice.tip { background:#fff6d8; color:#7a5c15; }

    @media (max-width:1180px){
      .workspace{ grid-template-columns:1fr; grid-template-areas:"hero" "message" "cart" "products"; }
      .cart{ position:static; }
    }

    @media (max-width:620px){
      .cart{
        position:fixed; bottom:0; left:0; right:0; z-index:50;
        border-radius:16px 16px 0 0;
        box-shadow:0 -10px 30px rgba(0,0,0,.15);
        max-height:65vh; overflow:auto;
      }
      .products-grid{ padding-bottom:70vh; grid-template-columns:1fr; }
      .btn{ min-height:48px; font-size:1rem; }
    }
  </style>
</head>
<body>
<main class="page">
  <section class="workspace">
    <section class="panel hero-panel">
      <span class="badge">Pedido en línea</span>
      <h1>Haz tu pedido</h1>
      <p class="muted">Elige tus productos, revisa tu carrito y envía tu pedido.</p>
    </section>

    <div id="msg" class="notice workspace-message"></div>

    <aside class="panel cart">
      <h2>Carrito</h2>
      <div id="menuInfo" class="notice tip"></div>
      <div id="comboTip" class="notice tip"></div>
      <div id="promoTip" class="notice ok"></div>
      <div id="carritoItems"><div class="muted">Aún no has agregado productos.</div></div>
      <button id="btnEnviar" class="btn primary" type="button" onclick="enviarPedido_()">Enviar mi pedido</button>
    </aside>

    <section class="products-grid">
      <div class="panel">
        <h2>Tortillas La Ma</h2>
        <div id="tlmProductos">Cargando...</div>
      </div>
      <div class="panel">
        <h2>La Cocina de Susy</h2>
        <select id="guisadoNombre"></select>
        <select id="guisadoPresentacion"></select>
        <input id="guisadoCantidad" type="number" value="1" />
        <button class="btn primary" onclick="agregarGuisado_()">Agregar</button>
      </div>
    </section>
  </section>
</main>

<script>
  let catalogoCliente = null;
  let carrito = [];
  let ventanaPedido = { abierta:true };

  cargarCatalogo_();

  function cargarCatalogo_(){
    google.script.run
      .withSuccessHandler(function(data){
        catalogoCliente = data || {};
        ventanaPedido = catalogoCliente.ventanaPedido || {abierta:true};
        document.getElementById("menuInfo").textContent = ventanaPedido.mensaje || "";
      })
      .withFailureHandler(function(err){
        document.getElementById("msg").textContent = err.message || err;
      })
      .obtenerDatosCliente("Lunes");
  }

  function agregarGuisado_(){ alert("Demo: guisado agregado"); }
  function enviarPedido_(){ alert("Demo: pedido enviado"); }
</script>
</body>
</html>
