<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel Viewer – Producción y Pedidos</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      margin: 0;
      padding: 16px;
      color: #222;
    }

    h1, h2, h3 {
      margin: 0 0 8px;
    }

    .muted {
      color: #666;
      font-size: 0.9rem;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }

    .kpi {
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      background: #f2f4f8;
    }

    .kpi .value {
      font-size: 1.4rem;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #fafafa;
      font-weight: 600;
    }

    .error {
      color: #b84434;
      font-weight: 500;
    }

    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: #777;
    }
  </style>
</head>

<body>

  <h1>Panel de Visualización</h1>
  <p class="muted">Vista solo lectura – Producción y pedidos</p>

  <div id="status" class="card">Cargando datos…</div>

  <div id="kpis"></div>
  <div id="tabla"></div>

  <footer>
    Panel Viewer · GitHub Pages
  </footer>

  <script>
    // ===============================
    // CONFIGURACIÓN
    // ===============================

    // 🔴 CAMBIA ESTA URL por tu Web App publicado
    const WEBAPP_URL = "https://script.google.com/macros/s/XXXXXXXXXXXX/exec";

    // Parámetros fijos o leídos de la URL
    const params = new URLSearchParams(window.location.search);
    const semana = params.get("semana") || "";
    const cocina = params.get("cocina") || "";

    // ===============================
    // CARGA PRINCIPAL
    // ===============================
    cargarViewer();

    async function cargarViewer() {
      try {
        const url = `${WEBAPP_URL}?view=viewer&semana=${encodeURIComponent(semana)}&cocina=${encodeURIComponent(cocina)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Error al obtener datos");
        const data = await res.json();

        document.getElementById("status").style.display = "none";

        renderKPIs(data.kpis || {});
        renderTabla(data.pedidos || []);

      } catch (err) {
        document.getElementById("status").innerHTML =
          "<span class='error'>No se pudieron cargar los datos.</span>";
        console.error(err);
      }
    }

    // ===============================
    // RENDER KPIs
    // ===============================
    function renderKPIs(kpis) {
      const el = document.getElementById("kpis");
      let html = "<div class='card'><h3>Resumen</h3><div class='grid'>";

      Object.keys(kpis).forEach(key => {
        html += `
          <div class="kpi">
            <div class="value">${kpis[key]}</div>
            <div class="muted">${key}</div>
          </div>
        `;
      });

      html += "</div></div>";
      el.innerHTML = html;
    }

    // ===============================
    // RENDER TABLA
    // ===============================
    function renderTabla(pedidos) {
      const el = document.getElementById("tabla");

      if (!pedidos.length) {
        el.innerHTML = "<div class='card'><p>No hay pedidos para los filtros seleccionados.</p></div>";
        return;
      }

      let html = `
        <div class="card">
          <h3>Pedidos</h3>
          <table>
            <tr>
              <th>Cliente</th>
              <th>Día</th>
              <th>Producto</th>
              <th>Detalle</th>
              <th>Cantidad</th>
            </tr>
      `;

      pedidos.forEach(p => {
        html += `
          <tr>
            <td>${p.cliente || ""}</td>
            <td>${p.diaEntrega || ""}</td>
            <td>${p.producto || ""}</td>
            <td>${p.detalle || ""}</td>
            <td>${p.cantidad || 0}</td>
          </tr>
        `;
      });

      html += "</table></div>";
      el.innerHTML = html;
    }
  </script>

</body>
</html>
