<!DOCTYPE html>
<!--
DOCUMENTACION TECNICA - VISOR DE PRODUCCION (Sistema Cocina)
-------------------------------------------------------------
PROPOSITO
- Mostrar SOLO el total de producción por cocina
- Diseñado para pantallas de cocina (PC o celular)
- Usa filtros básicos: semana, día y cocina

DEPENDENCIAS (Apps Script)
- obtenerSemanasDisponibles()
- getPanelFilters()
- getViewerProduccion()

NOTAS
- Este visor es solo lectura
- Se publica como Web App con ?view=viewer
-->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:wght@600&display=swap');

:root{
    --bg:#FAF8F5;
    --ink:#3A3530;
    --muted:#6b625a;
    --accent:#A53D30;
    --accent-2:#727D56;
    --accent-3:#E4B651;
    --header:#9C7A60;
    --card:#ffffff;
    --shadow:0 10px 30px rgba(58,53,48,0.08);
    --radius:14px;
  }

  body{
    font-family:'Manrope', sans-serif;
    background:var(--bg);
    margin:0;
    padding:16px;
    color:var(--ink);
  }

  .container{
    max-width:1100px;
    margin:auto;
  }

  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
    background:var(--header);
    padding:12px 14px;
    border-radius:var(--radius);
    border:1px solid rgba(0,0,0,0.05);
    box-shadow:var(--shadow);
  }

  .logo{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .logo img{
    max-height:80px;
    width:100%;
    max-width:520px;
    height:auto;
    object-fit:contain;
    display:block;
  }

  .header h2{
    margin:0;
    font-family:'Playfair Display', serif;
    color:#fffaf2;
  }

  #subtitulo{
    color:#f5efe8;
  }

  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    background:#fffaf2;
    padding:12px;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    margin-bottom:12px;
    border:1px solid #ede3d9;
  }

  .filters label{
    font-size:12px;
    color:#6b625a;
    display:block;
    margin-bottom:4px;
  }

  .filters select{
    padding:8px;
    border:1px solid #e5e7eb;
    border-radius:10px;
  }

  .card{
    background:var(--card);
    padding:16px;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }

  .kpi-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:10px;
  }

  .kpi{
    background:#ffffff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:12px;
  }

  .kpi small{color:var(--muted);}

  .viewer-detail-block{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid #eadfce;
  }

  .viewer-detail-block h4{
    margin:0 0 10px 0;
    font-size:18px;
    color:var(--header);
  }

  .viewer-detail-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
    gap:10px;
  }

  .viewer-detail-card{
    background:#fcfaf7;
    border:1px solid #eadfce;
    border-radius:12px;
    padding:12px;
  }

  .viewer-detail-card small{
    display:block;
    color:var(--muted);
    margin-bottom:4px;
  }

  .viewer-detail-card strong{
    display:block;
    margin-bottom:8px;
    color:var(--ink);
  }

  .viewer-detail-lines{
    display:grid;
    gap:6px;
  }

  .viewer-detail-line{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
    background:#fff;
    border:1px solid #efe4d8;
    border-radius:10px;
    padding:8px 10px;
  }

  .viewer-detail-line span:last-child{
    font-weight:700;
    color:var(--accent);
    white-space:nowrap;
  }

  .section-title{
    margin:6px 0 8px 0;
    font-weight:600;
  }

  .banner-kitchen{
    display:inline-block;
    padding:6px 10px;
    border-radius:999px;
    background:#727D56;
    color:#fffaf2;
    font-size:12px;
    margin-top:6px;
  }

  table{
    width:100%;
    border-collapse:collapse;
  }
  th{
    background:#efe4d8;
    color:#3A3530;
    text-align:left;
    padding:8px;
    font-weight:600;
  }
  td{
    padding:6px 8px;
    border-bottom:1px solid #e9e2d9;
  }
  table tr:nth-child(even) td{background:#fcfaf7;}

  .chip{
    display:inline-block;
    padding:4px 8px;
    border-radius:999px;
    font-size:12px;
    background:var(--accent-3);
    color:#3A3530;
    margin-right:6px;
  }
  .chip.primary{
    background:var(--accent);
    color:#fff;
  }

  /* ====== ESTILOS MODO M�VIL (FORZADO) ====== */
  body.mobile{
    font-size:40px;
    line-height:1.25;
  }
  body.mobile .container{max-width:100%;}
  body.mobile .header{padding:10px; margin-bottom:8px;}
  body.mobile .card{padding:18px;}
  body.mobile h2{font-size:44px;}
  body.mobile h3{font-size:36px;}
  body.mobile th, body.mobile td{font-size:34px; font-weight:700;}
  body.mobile .chip{font-size:16px; padding:6px 12px;}
  body.mobile .filters{display:none;}

  @media (max-width:700px){
    .header{flex-direction:column; align-items:flex-start;}
    .logo img{max-height:70px; max-width:100%;}
  }

  /* ====== MODO M�VIL (UI ampliada y vertical) ====== */
  @media (max-width:820px){
    body{padding:12px; font-size:16px;}
    .container{max-width:100%;}
    .filters{flex-direction:column; align-items:stretch;}
    .filters select{width:100%;}
    .card{padding:12px;}
    .kpi-grid{grid-template-columns:1fr;}

    /* Tablas responsivas tipo tarjeta */
    table.responsive{width:100%; border:0;}
    table.responsive tr:first-child{display:none;}
    table.responsive, table.responsive tbody, table.responsive tr, table.responsive td{display:block; width:100%;}
    table.responsive tr{
      margin-bottom:10px;
      border:1px solid #ede3d9;
      border-radius:12px;
      padding:8px 10px;
      background:#fffaf2;
    }
    table.responsive td{
      border:none;
      padding:6px 0;
    }
    table.responsive td::before{
      content:attr(data-label);
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:2px;
    }

    /* Móvil pequeño: aumenta aún más el tamaño */
    body.mobile{
      font-size:42px;
    }
    body.mobile h2{font-size:46px;}
    body.mobile h3{font-size:38px;}
    body.mobile th, body.mobile td{font-size:36px; font-weight:700;}
  }
  </style>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwOh48dsgpGVhCUbs4250L7dMHbbAvvv1-rdLWHq9pK5xiMfhQmS1HaRR2t2BZ0xblfOg/exec";

if (!(window.google && window.google.script && window.google.script.run)) {
  window.google = {
    script: {
      run: {
        _successHandler: null,
        _failureHandler: null,

        withSuccessHandler(fn) {
          this._successHandler = fn;
          return this;
        },

        withFailureHandler(fn) {
          this._failureHandler = fn;
          return this;
        },

        obtenerSemanasDisponibles() {
          callApi({ action: "obtenerSemanasDisponibles" }, this);
        },

        getPanelFilters() {
          callApi({ action: "getPanelFilters" }, this);
        },

        obtenerViewerProduccion(semana, filtros, cocina, forceRefresh) {
          callApi({
            action: "obtenerViewerProduccion",
            semana: semana,
            filtros: filtros || {},
            cocina: cocina || "",
            forceRefresh: !!forceRefresh
          }, this);
        }
      }
    }
  };
}

function callApi(payload, ctx) {
  fetch(WEB_APP_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if (!data.exito) throw new Error(data.message || "Error API");
    ctx._successHandler && ctx._successHandler(data);
  })
  .catch(function(err){
    console.error("API error:", err);
    ctx._failureHandler && ctx._failureHandler(err);
  });
}

function getViewerQueryParam_(name){
  try {
    return new URLSearchParams(window.location.search || "").get(name) || "";
  } catch (err) {
    return "";
  }
}

function viewerSetStatus_(text){
  const subtitle = document.getElementById("subtitulo");
  if (!subtitle) return;
  const base = "Visor para cocina";
  subtitle.innerHTML = text ? (base + " | <span class='banner-kitchen'>" + text + "</span>") : base;
}

function viewerCall_(action, args, handlers){
  const onSuccess = handlers && handlers.onSuccess ? handlers.onSuccess : null;
  const onError = handlers && handlers.onError ? handlers.onError : null;
  const params = Array.isArray(args) ? args : [];

  try {
    let runner = google.script.run
      .withSuccessHandler(function(res){
        if (onSuccess) onSuccess(res);
      })
      .withFailureHandler(function(err){
        if (onError) onError(err);
        else alert("Error del servidor:\n" + (err && err.message ? err.message : err));
      });

    runner[action].apply(null, params);
  } catch (err) {
    if (onError) onError(err);
    else alert("Error inesperado en cliente");
  }
}
</script>

</head>

        <small id="subtitulo" style="color:#6b7280;">Visor para cocina</small>
        <div style="margin-top:6px;">
          <button id="modeToggleBtn" class="chip" onclick="cycleUIMode()">Modo: Auto</button>
          <button id="filtersToggleBtn" class="chip" onclick="toggleFilters()">Mostrar filtros</button>
          <button id="refreshBtn" class="chip primary" onclick="cargarProduccion(true)">Actualizar ahora</button>
        </div>
      </div>
    </div>

    <!-- Filtros del visor (semana obligatoria) -->
    <div class="filters">
      <div>
        <label>Semana</label>
        <select id="semana"></select>
      </div>
      <div>
        <label>Día de entrega</label>
        <select id="dia"></select>
      </div>
      <div>
        <label>Cocina</label>
        <select id="cocina"></select>
      </div>
    </div>

    <div class="viewer-kitchen-switcher" style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px 0;">
      <button class="chip" type="button" onclick="setViewerKitchen_('La Cocina de Susy')">La Cocina de Susy</button>
      <button class="chip" type="button" onclick="setViewerKitchen_('Tortillas La Má')">Tortillas La Má</button>
      <button class="chip" type="button" onclick="setViewerKitchen_('')">Todas</button>
    </div>

    <div id="chips"></div>
    <div id="kpis" class="card"></div>

    <div id="produccionPresentacion" class="card"></div>
    <div id="produccionGuisados" class="card"></div>
  </div>

<script>
// Visor de producción (solo lectura)
const VIEWER_COCINA = getViewerQueryParam_("cocina");
const LOCK_COCINA = getViewerQueryParam_("lock") || "0";
let filtersVisible = true;

window.onload=function(){
  cargarSemanas();
  setupListeners();
  applyMobileMode();
};

function setupListeners(){
  ["semana","dia","cocina"].forEach(id=>{
    const el = document.getElementById(id);
    if (el) el.addEventListener("change", cargarProduccion);
  });
}

function setViewerKitchen_(cocina){
  const el = document.getElementById("cocina");
  if (!el) return;
  if (cocina) {
    el.value = cocina;
  } else if (el.options.length) {
    el.selectedIndex = 0;
  }
  cargarProduccion(true);
}

function cargarSemanas(){
  viewerCall_("obtenerSemanasDisponibles", [], {
    onSuccess: function(semanas){
    const sel = document.getElementById("semana");
    sel.innerHTML="";
    semanas.forEach(s=>{
      sel.appendChild(new Option(s,s));
    });
    cargarFiltrosBase();
    },
    onError: function(err){
      alert("Error al cargar semanas: " + (err && err.message ? err.message : err));
    }
  });
}

function cargarFiltrosBase(){
  viewerCall_("getPanelFilters", [], {
    onSuccess: function(data){
    const dia = document.getElementById("dia");
    dia.innerHTML="";
    dia.appendChild(new Option("Todo","Todo"));
    (data.dias || []).forEach(d=> dia.appendChild(new Option(d,d)));

    const cocina = document.getElementById("cocina");
    cocina.innerHTML="";
    (data.cocinas || []).forEach(c=> cocina.appendChild(new Option(c,c)));

    if (VIEWER_COCINA) {
      cocina.value = VIEWER_COCINA;
      if (LOCK_COCINA === "1" || LOCK_COCINA === "true") {
        cocina.disabled = true;
      }
    } else if (cocina.options.length) {
      cocina.selectedIndex = 0;
    }

    viewerSetStatus_(cocina.value || "Todas");

    cargarProduccion();
    },
    onError: function(err){
      alert("Error al cargar filtros: " + (err && err.message ? err.message : err));
    }
  });
}

function getViewerFilters(){
  return {
    semana: document.getElementById("semana").value,
    dia: document.getElementById("dia").value,
    cocina: document.getElementById("cocina").value
  };
}

function cargarProduccion(forceRefresh){
  const f = getViewerFilters();
  const filtros = { semana: f.semana, dia: f.dia, cocina: f.cocina };
  viewerCall_("getViewerProduccion", [f.semana, filtros, f.cocina, !!forceRefresh], {
    onSuccess: renderProduccion,
    onError: function(err){
      alert("Error al cargar producción: " + (err && err.message ? err.message : err));
    }
  });
}

/* =====================================================
 renderResumenOperativoViewer_
 Descripcion: dibuja el resumen operativo de Tortillas La Má para el viewer.
 Nota: se prioriza legibilidad móvil sobre la tabla técnica.
===================================================== */
function renderResumenOperativoViewer_(groups){
  if (!groups || !groups.length) {
    return "<p>Sin resumen operativo para los filtros seleccionados.</p>";
  }
  let html = "<div class='card'><h3>Resumen operativo</h3>";
  groups.forEach(group => {
    html += "<div style='background:#fcfaf7;border:1px solid #eadfce;border-radius:18px;padding:16px 18px;margin:12px 0;'>";
    html += "<div style='font-weight:800;font-size:1.05em;margin-bottom:8px;'>" + (group.titulo || group.producto || "") + "</div>";
    html += "<div style='display:grid;gap:8px;'>";
    (group.lineas || []).forEach(linea => {
      html += "<div><b>" + (linea.cantidad || 0) + "</b> " + (linea.label || "") + "</div>";
    });
    html += "</div></div>";
  });
  html += "</div>";
  return html;
}

/* =====================================================
 buildSusyPresentacionViewer_
 Descripcion: agrupa guisados y salsas por receta con sus presentaciones solicitadas.
 Nota: se alimenta de empaqueDetalle para reflejar exactamente lo que se cocina y empaca.
===================================================== */
function buildSusyPresentacionViewer_(rows){
  if (!rows || !rows.length) return "";
  const groups = {};
  rows.forEach(function(r){
    const producto = r.producto || "";
    const detalle = r.detalle || "";
    const presentacion = r.presentacion || "";
    const cantidad = Number(r.cantidad || 0);
    if (!producto || !detalle || !presentacion || !cantidad) return;
    const key = producto + "|" + detalle;
    if (!groups[key]) {
      groups[key] = { producto: producto, detalle: detalle, items: [] };
    }
    groups[key].items.push({ presentacion: presentacion, cantidad: cantidad });
  });

  const sorted = Object.keys(groups).map(function(key){
    return groups[key];
  }).sort(function(a, b){
    return a.producto.localeCompare(b.producto) || a.detalle.localeCompare(b.detalle);
  });

  let html = "<div class='viewer-detail-block'>";
  html += "<h4>Guisados / Salsas por presentación</h4>";
  html += "<div class='viewer-detail-grid'>";
  sorted.forEach(function(group){
    html += "<div class='viewer-detail-card'>";
    html += "<small>" + group.producto + "</small>";
    html += "<strong>" + group.detalle + "</strong>";
    html += "<div class='viewer-detail-lines'>";
    group.items.sort(function(a, b){
      return a.presentacion.localeCompare(b.presentacion);
    }).forEach(function(item){
      html += "<div class='viewer-detail-line'><span>" + item.presentacion + "</span><span>" + item.cantidad + "</span></div>";
    });
    html += "</div></div>";
  });
  html += "</div></div>";
  return html;
}

function renderProduccion(data){
  // Determina cocina del visor (para ocultar secciones no requeridas)
  const isTortillas = /tortillas/i.test((data.cocina || ""));
  const isSusy = /susy/i.test((data.cocina || ""));
  const chips = document.getElementById("chips");
  const kpis = document.getElementById("kpis");
  chips.innerHTML =
    "<span class='chip'>Semana: "+(data.semana||"")+"</span>" +
    "<span class='chip'>Cocina: "+(data.cocina||"")+"</span>";

  // Banner de cocina
  const subtitle = document.getElementById("subtitulo");
  if (subtitle && data.cocina){
    subtitle.innerHTML = "Plan de producción: <span class='banner-kitchen'>"+data.cocina+"</span>";
  }

  // KPIs rápidos (se ocultan en visor Tortillas)
  let totalLitros = 0;
  let totalSalsas = 0;
  let totalTortillas = 0;
  if (data.guisados && data.guisados.length){
    data.guisados.forEach(r=>{
      if (r.tipo === "Guisado") totalLitros += Number(r.litros || 0);
      if (r.tipo === "Salsa") totalSalsas += Number(r.litros || 0);
    });
  }
  if (data.porPresentacion && data.porPresentacion.length){
    data.porPresentacion.forEach(r=>{
      if (r.producto === "Tortilla" || r.producto === "Sope" || r.producto === "Huarache" || r.producto === "Gordita" || r.producto === "Gorditas"){
        totalTortillas += Number(r.cantidad || 0);
      }
    });
  }
  if (kpis){
    // En visor Tortillas, ocultamos KPIs para mostrar solo producción por presentación
    kpis.style.display = isTortillas ? "none" : "block";
    kpis.innerHTML =
      "<div class='kpi-grid'>" +
      "<div class='kpi'><small>Guisados (L)</small><div style='font-size:20px; font-weight:600;'>" + totalLitros.toFixed(2) + "</div></div>" +
      "<div class='kpi'><small>Salsas (L)</small><div style='font-size:20px; font-weight:600;'>" + totalSalsas.toFixed(2) + "</div></div>" +
      "<div class='kpi'><small>Tortillas/Antojitos</small><div style='font-size:20px; font-weight:600;'>" + totalTortillas.toFixed(0) + "</div></div>" +
      "</div>";
  }

  let htmlPres="<h3>Producción por presentación</h3>";
  if (isTortillas && data.resumenOperativo && data.resumenOperativo.length){
    htmlPres = renderResumenOperativoViewer_(data.resumenOperativo);
  } else if (isSusy) {
    htmlPres += "<table><tr><th>Tipo</th><th>Receta</th><th>Presentación</th><th>Cantidad</th></tr>";
    if (data.empaqueDetalle && data.empaqueDetalle.length){
      data.empaqueDetalle.forEach(r=>{
        htmlPres += "<tr><td>"+(r.producto||"")+"</td><td>"+(r.detalle||"")+"</td><td>"+(r.presentacion||"")+"</td><td>"+(r.cantidad||0)+"</td></tr>";
      });
    } else {
      htmlPres += "<tr><td colspan='4'>Sin datos para los filtros seleccionados.</td></tr>";
    }
    htmlPres += "</table>";
  } else {
    htmlPres+="<table><tr><th>Producto</th><th>Presentación</th><th>Cantidad</th></tr>";
    if (data.porPresentacion && data.porPresentacion.length){
      // En visor Tortillas/Susy, omitimos filas de Combo (ya vienen desglosadas por presentación)
      data.porPresentacion
        .filter(r=> !((isTortillas || isSusy) && r.producto === "Combo"))
        .forEach(r=>{
        htmlPres+="<tr><td>"+r.producto+"</td><td>"+r.presentacion+"</td><td>"+r.cantidad+"</td></tr>";
        });
    } else {
      htmlPres+="<tr><td colspan='3'>Sin datos para los filtros seleccionados.</td></tr>";
    }
    htmlPres+="</table>";
  }

  let htmlGui="<h3>Guisados / Salsas (litros)</h3>";
  htmlGui+="<table><tr><th>Tipo</th><th>Receta</th><th>Litros</th></tr>";
  if (data.guisados && data.guisados.length){
    data.guisados.forEach(r=>{
      const litrosVal = Number(r.litros || 0);
      const highlightG = (r.tipo === "Guisado" && litrosVal >= 2) ? " style='background:#fff7ed;'" : "";
      const highlightS = (r.tipo === "Salsa" && litrosVal >= 2) ? " style='background:#ecfeff;'" : "";
      const highlight = highlightG || highlightS;
      htmlGui+="<tr"+highlight+"><td>"+r.tipo+"</td><td>"+r.receta+"</td><td>"+litrosVal+" L</td></tr>";
    });
  } else {
    htmlGui+="<tr><td colspan='3'>Sin guisados/salsas para los filtros.</td></tr>";
  }
  htmlGui+="</table>";

  let htmlEmp="<h3>Empaque por guisado / salsa</h3>";
  htmlEmp+="<table><tr><th>Producto</th><th>Detalle</th><th>Presentación</th><th>Cantidad</th></tr>";
  if (data.empaqueDetalle && data.empaqueDetalle.length){
    data.empaqueDetalle.forEach(r=>{
      htmlEmp+="<tr><td>"+(r.producto||"")+"</td><td>"+(r.detalle||"")+"</td><td>"+(r.presentacion||"")+"</td><td>"+(r.cantidad||0)+"</td></tr>";
    });
  } else {
    htmlEmp+="<tr><td colspan='4'>Sin cantidades de empaque para los filtros seleccionados.</td></tr>";
  }
  htmlEmp+="</table>";

  document.getElementById("produccionPresentacion").innerHTML=htmlPres;
  // En visor Tortillas, ocultamos sección de guisados/salsas
  const gui = document.getElementById("produccionGuisados");
  if (gui){
    gui.style.display = isTortillas ? "none" : "block";
    if (!isTortillas) gui.innerHTML = htmlGui + htmlEmp;
  }

  // Ajuste de tablas a formato móvil (tarjetas)
  applyResponsiveTables();
}

/* =====================================================
 applyResponsiveTables
 Descripcion: adapta tablas a formato móvil (tarjetas).
===================================================== */
function applyResponsiveTables(){
  if (!isMobileEffective()) return;
  document.querySelectorAll("table").forEach(function(table){
    table.classList.add("responsive");
    const headerRow = table.querySelector("tr");
    if (!headerRow) return;
    const headers = Array.from(headerRow.querySelectorAll("th")).map(th=>th.textContent.trim());
    if (!headers.length) return;
    const rows = table.querySelectorAll("tr");
    rows.forEach(function(tr, idx){
      if (idx === 0) return;
      Array.from(tr.children).forEach(function(td, i){
        if (headers[i]) td.setAttribute("data-label", headers[i]);
      });
    });
  });
}

/* =====================================================
 applyMobileMode / cycleUIMode
 Descripcion: alterna Auto -> Móvil -> PC en el visor.
===================================================== */
function getModePref_(){
  try { return localStorage.getItem("viewer_mode_pref") || "auto"; } catch(e){ return "auto"; }
}

function setModePref_(value){
  try { localStorage.setItem("viewer_mode_pref", value); } catch(e){}
}

function getEffectiveMode_(){
  const pref = getModePref_();
  if (pref === "mobile" || pref === "desktop") return pref;
  return (window.innerWidth <= 820) ? "mobile" : "desktop";
}

function isMobileEffective(){
  return getEffectiveMode_() === "mobile";
}

function applyMobileMode(){
  const mode = getEffectiveMode_();
  document.body.classList.toggle("mobile", mode === "mobile");
  document.body.classList.toggle("desktop", mode === "desktop");
  updateModeToggleLabel();
  if (mode === "mobile") applyResponsiveTables();
  if (mode === "mobile") {
    // En móvil, ocultamos filtros por defecto para ganar espacio
    if (filtersVisible === true) {
      filtersVisible = false;
      applyFiltersVisibility_();
    }
  } else {
    filtersVisible = true;
    applyFiltersVisibility_();
  }
}

function cycleUIMode(){
  const pref = getModePref_();
  const next = (pref === "auto") ? "mobile" : (pref === "mobile") ? "desktop" : "auto";
  setModePref_(next);
  applyMobileMode();
  applyResponsiveTables();
}

function updateModeToggleLabel(){
  const btn = document.getElementById("modeToggleBtn");
  if (!btn) return;
  const pref = getModePref_();
  btn.textContent = pref === "auto" ? "Modo: Auto" : (pref === "mobile" ? "Modo: Móvil" : "Modo: PC");
}

/* =====================================================
 toggleFilters / applyFiltersVisibility_
 Descripcion: muestra/oculta filtros en móvil.
===================================================== */
function toggleFilters(){
  filtersVisible = !filtersVisible;
  applyFiltersVisibility_();
}

function applyFiltersVisibility_(){
  const filters = document.querySelector(".filters");
  const btn = document.getElementById("filtersToggleBtn");
  if (!filters || !btn) return;
  if (filtersVisible){
    filters.style.display = "flex";
    btn.textContent = "Ocultar filtros";
  } else {
    filters.style.display = "none";
    btn.textContent = "Mostrar filtros";
  }
}

window.addEventListener("resize", function(){
  if (getModePref_() === "auto"){
    applyMobileMode();
    applyResponsiveTables();
  }
});
</script>
</body>
</html>
